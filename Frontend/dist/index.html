<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS | Workspace Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { mono: ['JetBrains Mono', 'monospace'] },
          colors: {
            'theme-bg':      '#0a0f1a',
            'theme-surface': '#141d2e',
            'theme-glass':   'rgba(255,255,255,0.06)',
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --bg:       #0a0f1a;
      --bg2:      #0f1623;
      --bg3:      #141d2e;
      --bg4:      #1a2438;
      --border:   rgba(255,255,255,0.06);
      --border2:  rgba(255,255,255,0.12);
      --text:     #e2e8f0;
      --text2:    #64748b;
      --text3:    #94a3b8;
      --blue:     #3b82f6;
      --blue2:    #2563eb;
      --cyan:     #06b6d4;
      --green:    #10b981;
      --red:      #ef4444;
      --orange:   #f59e0b;
      --purple:   #8b5cf6;
      --sidebar-w: 260px;

      /* ── Legacy alias vars (used by older components) ── */
      --text-main:   #e2e8f0;
      --text-muted:  #64748b;
      --border-glass: rgba(255,255,255,0.06);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* ── Glass Card ── */
    .glass {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .glass-sm {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--bg2);
      border-right: 1px solid var(--border);
      height: 100vh;
      display: flex;
      flex-direction: column;
      transition: width 0.3s ease;
      overflow: hidden;
    }
    .sidebar.mini { width: 68px; min-width: 68px; }

    /* ── Nav Item ── */
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      transition: all 0.15s;
      white-space: nowrap;
      overflow: hidden;
      position: relative;
    }
    .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .nav-item.active { background: rgba(59,130,246,0.12); color: var(--blue); font-weight: 600; }
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 3px;
      background: var(--blue);
      border-radius: 0 3px 3px 0;
    }
    .nav-section {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text2);
      padding: 16px 12px 6px;
      opacity: 0.5;
    }
    .nav-badge {
      margin-left: auto;
      background: rgba(59,130,246,0.15);
      color: var(--blue);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      flex-shrink: 0;
    }

    /* ── Inputs ── */
    .inp {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s;
      outline: none;
    }
    .inp:focus { border-color: var(--blue); }
    .inp::placeholder { color: var(--text2); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      font-family: 'Inter', sans-serif;
    }
    .btn:hover { border-color: var(--border2); background: rgba(255,255,255,0.04); }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
    .btn-primary:hover { background: var(--blue2); border-color: var(--blue2); }
    .btn-danger { color: var(--red); border-color: rgba(239,68,68,0.3); }
    .btn-danger:hover { background: rgba(239,68,68,0.08); }
    .btn-success { color: var(--green); border-color: rgba(16,185,129,0.3); }
    .btn-success:hover { background: rgba(16,185,129,0.08); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-xs { padding: 4px 10px; font-size: 11px; border-radius: 6px; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Status badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .badge-green  { background: rgba(16,185,129,0.12); color: var(--green); }
    .badge-red    { background: rgba(239,68,68,0.12);  color: var(--red); }
    .badge-blue   { background: rgba(59,130,246,0.12); color: var(--blue); }
    .badge-orange { background: rgba(245,158,11,0.12); color: var(--orange); }
    .badge-purple { background: rgba(139,92,246,0.12); color: var(--purple); }
    .badge-gray   { background: rgba(100,116,139,0.12); color: var(--text2); }

    /* ── Stat card ── */
    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
    }
    .stat-label { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-val   { font-size: 28px; font-weight: 800; margin: 6px 0 2px; letter-spacing: -0.5px; }
    .stat-sub   { font-size: 11px; color: var(--text2); }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; }
    th {
      padding: 10px 14px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text2);
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
    }
    th:first-child { border-radius: 8px 0 0 0; }
    th:last-child  { border-radius: 0 8px 0 0; }
    td {
      padding: 11px 14px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.015); }

    /* ── Checkbox ── */
    input[type=checkbox] {
      width: 15px; height: 15px;
      accent-color: var(--blue);
      cursor: pointer;
    }

    /* ── Toggle ── */
    .toggle {
      width: 38px; height: 20px;
      background: var(--bg4);
      border-radius: 20px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .toggle.on { background: var(--blue); border-color: var(--blue); }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 14px; height: 14px;
      background: #fff;
      border-radius: 50%;
      transition: left 0.2s;
    }
    .toggle.on::after { left: 20px; }

    /* ── Toast ── */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      min-width: 260px;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      animation: toast-in 0.3s ease;
      pointer-events: all;
    }
    .toast-ok  { background: #064e3b; border: 1px solid rgba(16,185,129,0.3); }
    .toast-err { background: #7f1d1d; border: 1px solid rgba(239,68,68,0.3); }
    .toast-info { background: #1e3a5f; border: 1px solid rgba(59,130,246,0.3); }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Misc ── */
    .mono { font-family: 'JetBrains Mono', monospace; }
    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
    }
    .label { font-size: 11px; font-weight: 600; color: var(--text2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
    .dot-green  { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
    .dot-red    { width: 7px; height: 7px; border-radius: 50%; background: var(--red);   flex-shrink: 0; }
    .dot-orange { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); flex-shrink: 0; }
    .dot-blue   { width: 7px; height: 7px; border-radius: 50%; background: var(--blue);   flex-shrink: 0; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }
    .pulse { animation: pulse 2s infinite; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
    }
    .modal {
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 14px;
      padding: 24px;
      width: 90%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-title { font-size: 15px; font-weight: 700; margin-bottom: 18px; }

    /* ── Login page ── */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      position: relative;
    }
    .login-card {
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
    }

    /* ── Accent line on cards ── */
    .card-accent { border-top: 2px solid var(--blue); }

    /* ── Legacy compat classes (used by older components) ── */
    .glass-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      backdrop-filter: blur(12px);
    }
    .glass-input {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      width: 100%;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s;
    }
    .glass-input:focus { border-color: var(--blue); }
    .btn-glow {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--text);
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: all 0.15s; font-family: 'Inter', sans-serif;
      padding: 8px 16px;
    }
    .btn-glow:hover:not(:disabled) { border-color: var(--border2); background: rgba(255,255,255,0.04); }
    .btn-glow:disabled { opacity: 0.35; cursor: not-allowed; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 700;
      padding: 3px 8px; border-radius: 6px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .animate-in { animation: fadein 0.3s ease; }
    .fade-in { animation: fadein 0.3s ease; }
    @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .slide-in-from-bottom-10 { animation: slidein 0.3s ease; }
    @keyframes slidein { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .bg-theme-surface { background: var(--bg3); }
    .text-theme-main { color: var(--text); }
    .text-theme-muted { color: var(--text2); }
    .border-theme-glass { border-color: var(--border); }
    .divide-theme-glass > * + * { border-top: 1px solid var(--border); }
    .tracking-tightest { letter-spacing: -0.05em; }
  </style>
  <link rel="stylesheet" href="/index.css">
  <script type="module" crossorigin src="/assets/index-0Itwz_TP.js"></script>
</head>
<body>
  <div id="root"></div>
  <div id="toast-container"></div>
</body>
</html>
